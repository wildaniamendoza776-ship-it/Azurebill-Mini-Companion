<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1033"><meta name="robots" content="noindex">
<link rel="icon" href="assets/icono.png">
<title>Azurebill — Nueva contraseña / New password / 新密码</title>
<style>
:root{--bg:#1b1033;--card:#2a1a4e;--ac:#b388ff;--tx:#f4eeff;--mu:#b5acd0;--er:#ff8a9b;--ok:#7be0a8}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
img{image-rendering:pixelated}
h1{margin:0;font-size:1.5rem}
p{margin:0;max-width:320px;color:var(--mu);line-height:1.45}
input,select{width:min(320px,100%);font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--ac);background:#0004;color:var(--tx)}
select{background:var(--card);font-size:16px;padding:10px}
button,a.btn{font:inherit;display:inline-block;text-decoration:none;text-align:center;color:#1b1033;background:var(--ac);font-weight:700;font-size:18px;width:min(320px,100%);padding:14px;border:0;border-radius:16px;min-height:48px}
button:disabled{opacity:.6}
#msg{min-height:1.4em;font-size:14px}.er{color:var(--er)}.ok{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;width:min(320px,100%)}.row input{flex:1;min-width:0}.row button{width:auto;padding:0 14px;font-size:20px;background:var(--card);color:var(--tx)}
[hidden]{display:none!important}
</style></head><body><main>
<img src="assets/assets-azurebill/azu-saluda.gif" height="120" alt="">
<select id="lang" aria-label="Language"><option value="es">🇪🇸 Español</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option></select>
<h1 id="t"></h1>
<p id="info"></p>
<div id="form" style="display:contents">
 <div class="row"><input id="p1" type="password" autocomplete="new-password" minlength="8"><button id="s1" type="button" aria-label="👁">👁</button></div>
 <input id="p2" type="password" autocomplete="new-password" minlength="8">
 <button id="go" type="button"></button>
</div>
<p id="msg" role="status"></p>
<a id="back" class="btn" href="index.html" hidden></a>
<p><a id="priv" href="privacidad.html" style="color:var(--ac)"></a></p>
</main>
<script src="config.js"></script>
<script src="restablecer.js"></script>
</body></html>
